version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: taskscheduler-rabbitmq-dev
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_dev_data:/var/lib/rabbitmq
    networks:
      - taskscheduler-dev-network

volumes:
  rabbitmq_dev_data:

networks:
  taskscheduler-dev-network:
    driver: bridge